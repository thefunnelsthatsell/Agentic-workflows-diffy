    - *id028
    - *id029
    - *id030
    - *id031
    - ./envs/core-services/api-worker.defaults
    - ./envs/core-services/api.defaults
    - ./.env
    networks:
    - ssrf_proxy_network
    - default
    restart: always
    image: langgenius/dify-api:1.18.0
    environment:
      MODE: api
      DB_HOST: ${DB_HOST:-db_postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD_missing}
      DB_DATABASE: ${DB_DATABASE:-dify}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY_missing}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    volumes:
    - ./volumes/app/storage:/app/api/storage
    healthcheck:
      test:
      - CMD
