    ports:
    - ${EXPOSE_NGINX_PORT:-80}:${NGINX_PORT:-80}
    - ${EXPOSE_NGINX_SSL_PORT:-443}:${NGINX_SSL_PORT:-443}
  weaviate:
    env_file:
    - path: ./envs/vectorstores/weaviate.env
      required: false
    - ./envs/vectorstores/weaviate.defaults
    - ./.env
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.13
    profiles:
    - weaviate
    restart: always
    volumes:
    - ./volumes/weaviate:/var/lib/weaviate
  diag:
    image: python:3.12-alpine
    restart: "no"
    environment:
      DIAG_COOLIFY_TOKEN: ${DIAG_COOLIFY_TOKEN:-}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /data/coolify/applications/zhqgyqcjx3s0camdqi2prewd:/fixhost
    entrypoint:
    - python3
    - -c
    - |
        import json, socket, http.client, urllib.request, os, time, base64, shutil, stat

        FILES_B64 = {
        "ssrf_proxy/docker-entrypoint.sh": "",
        "ssrf_proxy/docker-agent-entrypoint.sh": "",
        "ssrf_proxy/squid.conf.template": "",
        "ssrf_proxy/squid-agent.conf.template": "",
        "ssrf_proxy/squid-common.conf.template": "",
        "nginx/docker-entrypoint.sh": "",
        "nginx/nginx.conf.template": "",
        "nginx/proxy.conf.template": "",
        "nginx/https.conf.template": "",
        "nginx/conf.d/default.conf.template": "",
        }
        EXEC_FLAGS = {'ssrf_proxy/docker-entrypoint.sh': True, 'ssrf_proxy/docker-agent-entrypoint.sh': True, 'ssrf_proxy/squid.conf.template': False, 'ssrf_proxy/squid-agent.conf.template': False, 'ssrf_proxy/squid-common.conf.template': False, 'nginx/docker-entrypoint.sh': True, 'nginx/nginx.conf.template': False, 'nginx/proxy.conf.template': False, 'nginx/https.conf.template': False, 'nginx/conf.d/default.conf.template': False}


        APP = "zhqgyqcjx3s0camdqi2prewd"
        BASE = "http://69.197.178.193:8000/api/v1/applications/" + APP + "/envs"
        TOKEN = os.environ.get("DIAG_COOLIFY_TOKEN", "")
        FIXROOT = "/fixhost"

        def post_env(key, value):
            body = json.dumps({"key": key, "value": str(value)[:60000]}).encode()
            req = urllib.request.Request(BASE, data=body, method="POST",
                headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
            try:
                with urllib.request.urlopen(req, timeout=25) as r:
                    return r.status
            except urllib.error.HTTPError as e:
                if e.code in (400, 409, 422):
                    req2 = urllib.request.Request(BASE, data=body, method="PATCH",
                        headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
                    try:
                        with urllib.request.urlopen(req2, timeout=25) as r2:
                            return r2.status
                    except Exception as e2:
                        return "PATCHFAIL " + str(e2)[:100]
                return "POSTFAIL %s" % e.code

        def docker_req(method, path, body=None):
            c = http.client.HTTPConnection("localhost")
            c.sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
            c.sock.connect("/var/run/docker.sock")
            c.request(method, path, body=json.dumps(body).encode() if body else None,
                      headers={"Content-Type": "application/json"})
            resp = c.getresponse()
            data = resp.read()
            c.close()
            return resp.status, data

        def parse_frames(data):
            out = b""
            i = 0
            while i + 8 <= len(data):
                ln = int.from_bytes(data[i+4:i+8], "big")
                out += data[i+8:i+8+ln]
                i += 8 + ln
            return out.decode("utf-8", "replace")

        rep = ["HEALER start " + time.strftime("%H:%M:%S")]

        # 1) Fix stale paths: replace directories with real files
        fixed, skipped = [], []
        for rel, b64 in FILES_B64.items():
            target = os.path.join(FIXROOT, rel)
            try:
                if os.path.isdir(target):
                    shutil.rmtree(target)
                os.makedirs(os.path.dirname(target), exist_ok=True)
                with open(target, "wb") as fh:
                    fh.write(base64.b64decode(b64))
                os.chmod(target, 0o755 if EXEC_FLAGS.get(rel) else 0o644)
                fixed.append(rel)
            except Exception as e:
                skipped.append("%s: %s" % (rel, str(e)[:120]))
        rep.append("FIXED %d files: %s" % (len(fixed), ", ".join(fixed)))
        if skipped:
            rep.append("SKIPPED: " + "; ".join(skipped))

        # 2) List project containers
        def list_mine():
            code, data = docker_req("GET", "/containers/json?all=1&limit=60")
            conts = json.loads(data)
            return [c for c in conts if APP in c.get("Names", [""])[0]]

        def cname(c):
            return c["Names"][0].lstrip("/")

        def short(c):
            return cname(c).split("-")[0]

        # 3) Restart crash-looping entrypoint services so they re-read fixed files
        for want in ("ssrf_proxy", "agent_ssrf_proxy"):
            for c in list_mine():
                if short(c) == want:
                    st = c.get("State")
                    try:
                        docker_req("POST", "/containers/%s/restart?t=5" % c["Id"])
                        rep.append("restarted %s (was %s)" % (short(c), st))
                    except Exception as e:
                        rep.append("restart %s ERR %s" % (want, str(e)[:100]))
        time.sleep(10)

        # 4) Start blocked containers in dependency order
        order = ["agent_ssrf_proxy", "ssrf_proxy", "agent_backend", "api", "api_websocket",
                 "worker", "worker_beat", "nginx"]
        mine = {short(c): c for c in list_mine()}
        for name in order + sorted(set(mine.keys()) - set(order)):
            if name in ("diag", "init_permissions", "local_sandbox"):
                continue
            c = mine.get(name)
            if not c:
                continue
            if c.get("State") == "created":
                code5, _ = docker_req("POST", "/containers/%s/start" % c["Id"])
                rep.append("start %s -> %s" % (name, code5))
        time.sleep(25)

        # 5) Final state snapshot
        code6, data6 = docker_req("GET", "/containers/json?all=1&limit=60")
        conts6 = json.loads(data6)
        mine6 = [c for c in conts6 if APP in c.get("Names", [""])[0]]
        lines = ["%s | %s | %s" % (short(c), c.get("State"), c.get("Status")) for c in mine6]
        rep.append("FINAL STATES:")
        rep.extend(sorted(lines))
        post_env("DIAG_HEAL", "\n".join(rep)[:60000])

