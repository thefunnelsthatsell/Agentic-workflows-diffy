services:
  init_permissions:
    image: busybox:latest
    command:
    - sh
    - -c
    - "FLAG_FILE=\"/app/api/storage/.init_permissions\"\nif [ -f \"$${FLAG_FILE}\" ]; then\n  echo \"Permissions already initialized. Exiting.\"\n  exit 0\nfi\necho \"Initializing permissions for /app/api/storage\"\nchown -R 1001:1001 /app/api/storage && touch \"$${FLAG_FILE}\"\necho \"Permissions initialized. Exiting.\"\n"
    volumes:
    - ./volumes/app/storage:/app/api/storage
    restart: 'no'
  api:
    env_file:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - *id011
    - *id012
    - *id013
    - *id014
    - *id015
    - *id016
    - *id017
    - *id018
    - *id019
    - *id020
    - *id021
    - *id022
    - *id023
    - *id024
    - *id025
    - *id026
    - *id027
    - *id028
    - *id029
    - *id030
    - *id031
    - ./envs/core-services/api-worker.defaults
    - ./envs/core-services/api.defaults
    - ./.env
    networks:
    - ssrf_proxy_network
    - default
    restart: always
    image: langgenius/dify-api:1.18.0
    environment:
      MODE: api
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    volumes:
    - ./volumes/app/storage:/app/api/storage
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  api_websocket:
    env_file:
