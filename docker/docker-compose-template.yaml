  - knowledge-fs-celery
  restart: always
  stop_grace_period: 125m
  env_file:
  - path: ./envs/core-services/shared.env
    required: false
  - path: ./envs/core-services/api-worker.env
    required: false
  - path: ./envs/security.env
    required: false
  - path: ./envs/databases/db-postgres.env
    required: false
  - path: ./envs/databases/db-mysql.env
    required: false
  - path: ./envs/databases/redis.env
    required: false
  - path: ./envs/core-services/knowledge-fs.env
    required: false
  - path: ./envs/core-services/knowledge-fs-worker.env
    required: false
  - path: ./envs/core-services/worker.env
    required: false
  - ./.env
  - ./envs/core-services/api-worker.defaults
  - ./envs/core-services/worker.defaults
  environment:
    MODE: worker
    MIGRATION_ENABLED: 'false'
    CELERY_WORKER_POOL: prefork
    CELERY_PREFETCH_MULTIPLIER: '1'
    MAX_TASKS_PER_CHILD: ${KNOWLEDGE_FS_WORKER_MAX_TASKS_PER_CHILD:-1000}
    DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
    DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
    KNOWLEDGE_INTEGRATED_MODE_ENABLED: ${KNOWLEDGE_INTEGRATED_MODE_ENABLED:-true}
    KNOWLEDGE_DIRECT_UPLOAD_ENABLED: ${KNOWLEDGE_DIRECT_UPLOAD_ENABLED:-true}
  depends_on:
    api:
      condition: service_healthy
  networks:
  - default
