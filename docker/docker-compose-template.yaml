services:
  init_permissions:
    image: busybox:latest
    command:
    - sh
    - -c
    - "FLAG_FILE=\"/app/api/storage/.init_permissions\"\nif [ -f \"$${FLAG_FILE}\" ]; then\n  echo \"Permissions already initialized. Exiting.\"\n  exit 0\nfi\necho \"Initializing permissions for /app/api/storage\"\nchown -R 1001:1001 /app/api/storage && touch \"$${FLAG_FILE}\"\necho \"Permissions initialized. Exiting.\"\n"
    volumes:
    - ./volumes/app/storage:/app/api/storage
    restart: 'no'
  api:
    env_file: *id001
    networks:
    - ssrf_proxy_network
    - default
    restart: always
    image: langgenius/dify-api:1.18.0
    environment:
      MODE: api
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    volumes:
    - ./volumes/app/storage:/app/api/storage
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  api_websocket:
    env_file: *id001
    networks:
    - ssrf_proxy_network
    - default
    restart: always
    image: langgenius/dify-api:1.18.0
    profiles:
    - collaboration
    environment:
      MODE: api
    entrypoint:
    - /bin/bash
    - -c
    - 'export SERVER_WORKER_AMOUNT="$${API_WEBSOCKET_WORKER_AMOUNT:-1}"

      export SERVER_WORKER_CLASS="$${API_WEBSOCKET_WORKER_CLASS:-geventwebsocket.gunicorn.workers.GeventWebSocketWorker}"

      export SERVER_WORKER_CONNECTIONS="$${API_WEBSOCKET_WORKER_CONNECTIONS:-1000}"

      export GUNICORN_TIMEOUT="$${API_WEBSOCKET_GUNICORN_TIMEOUT:-360}"

      exec /bin/bash /entrypoint.sh

      '
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
    volumes:
    - ./volumes/app/storage:/app/api/storage
  worker:
    env_file: *id002
    networks:
    - ssrf_proxy_network
    - default
    restart: always
    image: langgenius/dify-api:1.18.0
    environment:
      MODE: worker
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    volumes:
    - ./volumes/app/storage:/app/api/storage
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A celery_healthcheck.celery inspect ping
      interval: ${COMPOSE_WORKER_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${COMPOSE_WORKER_HEALTHCHECK_TIMEOUT:-30s}
      retries: 3
      start_period: 60s
      disable: ${COMPOSE_WORKER_HEALTHCHECK_DISABLED:-true}
  worker_beat:
    env_file: *id003
    networks:
    - ssrf_proxy_network
    - default
    restart: always
    image: langgenius/dify-api:1.18.0
    environment:
      MODE: beat
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A celery_healthcheck.celery inspect ping
      interval: ${COMPOSE_WORKER_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${COMPOSE_WORKER_HEALTHCHECK_TIMEOUT:-30s}
      retries: 3
      start_period: 60s
      disable: ${COMPOSE_WORKER_HEALTHCHECK_DISABLED:-true}
  web:
    image: langgenius/dify-web:1.18.0
    restart: always
    env_file:
    - path: ./envs/core-services/web.env
      required: false
    - path: ./envs/security.env
      required: false
    - ./.env
    - ./envs/core-services/web.defaults
  db_postgres:
    env_file:
    - path: ./envs/databases/db-postgres.env
      required: false
    - ./envs/databases/db-postgres.defaults
    image: postgres:15-alpine
    profiles:
    - postgresql
    restart: always
    volumes:
    - db_postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h db_postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD_missing}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      PGDATA: /var/lib/postgresql/data/pgdata
  redis:
    env_file:
    - path: ./envs/databases/redis.env
      required: false
    - ./envs/databases/redis.defaults
    image: redis:6-alpine
    restart: always
    volumes:
    - ./volumes/redis/data:/data
    command:
    - sh
    - -c
    - exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep -q PONG
  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: always
    env_file:
    - path: ./envs/core-services/sandbox.env
      required: false
    - path: ./envs/security.env
      required: false
    - ./.env
    - ./envs/core-services/sandbox.defaults
    volumes:
    - ./volumes/sandbox/dependencies:/dependencies
    - ./volumes/sandbox/conf:/conf
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f "http://localhost:$$SANDBOX_PORT/health"
    networks:
    - ssrf_proxy_network
  local_sandbox:
    image: langgenius/dify-agent-local-sandbox:1.18.0
    command:
    - shellctl
    - serve
    - --listen
    - 0.0.0.0:5004
    - --require-auth-token
    restart: always
    env_file:
    - path: ./envs/core-services/local-sandbox.env
      required: false
    environment:
    - SHELLCTL_AUTH_TOKEN=${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:-${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-}}
    - HTTP_PROXY=http://agent_ssrf_proxy:3128
    - HTTPS_PROXY=http://agent_ssrf_proxy:3128
    - NO_PROXY=localhost,127.0.0.1
    volumes:
    - dify_agent_local_sandbox_home:/home/dify
    - dify_agent_local_sandbox_workspace:/workspace
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5004/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
    - agent_sandbox_network
    - local_sandbox_proxy_network
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.11-local
    restart: always
    env_file:
    - path: ./envs/core-services/shared.env
      required: false
    - path: ./envs/core-services/api-worker.env
      required: false
    - path: ./envs/core-services/plugin-daemon.env
      required: false
    - path: ./envs/security.env
      required: false
    - path: ./envs/databases/db-postgres.env
      required: false
    - path: ./envs/databases/db-mysql.env
      required: false
    - path: ./envs/databases/redis.env
      required: false
    - ./.env
    - ./envs/core-services/api-worker.defaults
    - ./envs/core-services/plugin-daemon.defaults
    networks:
    - ssrf_proxy_network
    - default
    environment:
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
    ports:
    - ${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:${PLUGIN_DEBUGGING_PORT:-5003}
    volumes:
    - ./volumes/plugin_daemon:/app/storage
    depends_on:
      db_postgres:
        condition: service_healthy
        required: true
  agent_backend:
    image: langgenius/dify-agent-backend:1.18.0
    restart: always
    env_file:
    - path: ./envs/security.env
      required: false
    - path: ./envs/databases/redis.env
      required: false
    - path: ./envs/core-services/dify-agent.env
      required: false
    - ./.env
    - ./envs/core-services/dify-agent.defaults
    environment:
      DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: ${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:-${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-}}
    depends_on:
      redis:
        condition: service_started
      plugin_daemon:
        condition: service_started
    networks:
    - default
    - agent_sandbox_network
  agent_ssrf_proxy:
    image: ubuntu/squid:latest
    restart: always
    volumes:
    - ./ssrf_proxy/squid-agent.conf.template:/etc/squid/squid.conf.template
    - ./ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template
    - ./ssrf_proxy/docker-agent-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
    - sh
    - -c
    - "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    env_file:
    - path: ./envs/infrastructure/ssrf-proxy.env
      required: false
    - ./envs/infrastructure/ssrf-proxy.defaults
    networks:
    - default
    - local_sandbox_proxy_network
  ssrf_proxy:
    env_file:
    - path: ./envs/infrastructure/ssrf-proxy.env
      required: false
    - ./envs/infrastructure/ssrf-proxy.defaults
    image: ubuntu/squid:latest
    restart: always
    volumes:
    - ./ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template
    - ./ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template
    - ./ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
    - sh
    - -c
    - "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    networks:
    - ssrf_proxy_network
    - default
  nginx:
    env_file:
    - path: ./envs/infrastructure/nginx.env
      required: false
    - ./envs/infrastructure/nginx.defaults
    image: nginx:latest
    restart: always
    volumes:
    - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
    - ./nginx/proxy.conf.template:/etc/nginx/proxy.conf.template
    - ./nginx/https.conf.template:/etc/nginx/https.conf.template
    - ./nginx/conf.d:/etc/nginx/conf.d
    - ./nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    - ./nginx/ssl:/etc/ssl
    - ./volumes/certbot/conf/live:/etc/letsencrypt/live
    - ./volumes/certbot/conf:/etc/letsencrypt
    - ./volumes/certbot/www:/var/www/html
    entrypoint:
    - sh
    - -c
    - "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    environment:
      NGINX_SSL_PORT: ${NGINX_SSL_PORT:-443}
      NGINX_PORT: ${NGINX_PORT:-80}
    depends_on:
    - api
    - web
    ports:
    - ${EXPOSE_NGINX_PORT:-80}:${NGINX_PORT:-80}
    - ${EXPOSE_NGINX_SSL_PORT:-443}:${NGINX_SSL_PORT:-443}
  weaviate:
    env_file:
    - path: ./envs/vectorstores/weaviate.env
      required: false
    - ./envs/vectorstores/weaviate.defaults
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.13
    profiles:
    - weaviate
    restart: always
    volumes:
    - ./volumes/weaviate:/var/lib/weaviate
networks:
  ssrf_proxy_network:
    driver: bridge
    internal: true
  local_sandbox_proxy_network:
    driver: bridge
    internal: true
  agent_sandbox_network:
    driver: bridge
    internal: true
  milvus:
    driver: bridge
  opensearch-net:
    driver: bridge
    internal: true
volumes:
  oradata: null
  dify_es01_data: null
  dify_agent_local_sandbox_home: null
  dify_agent_local_sandbox_workspace: null
  db_postgres_data: {}
  db_postgres_data_v2: {}
